  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="90" y="23" fill="#8b949e" font-size="14">introduction.cpp</text>
  <rect x="392" y="9" width="68" height="20" rx="4" fill="#1f6feb" opacity="0.15"/>
  <text x="426" y="23" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">C++17</text>

  <g font-size="16">
    <text x="18" y="66" fill="#484f58" font-size="15">01</text>
    <g clip-path="url(#clip01)">
