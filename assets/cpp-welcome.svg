    </g>

    <text x="18" y="94" fill="#484f58" font-size="15">02</text>
    <g clip-path="url(#clip02)">
      <text x="52" y="94"><tspan fill="#ff7b72">using namespace</tspan><tspan fill="#d2a8ff"> std</tspan><tspan fill="#c9d1d9">;</tspan></text>
    </g>

    <text x="18" y="122" fill="#484f58" font-size="15">03</text>
    <g clip-path="url(#clip03)">
      <text x="52" y="122"><tspan fill="#ff7b72">int</tspan><tspan fill="#d2a8ff"> main</tspan><tspan fill="#c9d1d9">()</tspan></text>
    </g>

    <text x="18" y="150" fill="#484f58" font-size="15">04</text>
    <g clip-path="url(#clip04)">
      <text x="52" y="150" fill="#c9d1d9">{</text>
    </g>

    <text x="18" y="178" fill="#484f58" font-size="15">05</text>
    <g clip-path="url(#clip05)">
      <text x="52" y="178" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#79c0ff">cout</tspan><tspan fill="#ff7b72"> &lt;&lt; </tspan><tspan fill="#a5d6ff">"Welcome to Md-Manam-Khan"</tspan><tspan fill="#c9d1d9">;</tspan></text>
